<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cbomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.15)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.05)"/>
    </linearGradient>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#cbomBg)"/>

  <!-- Top Root: CycloneDX 1.6 Specification -->
  <g transform="translate(260, 40)">
    <rect width="280" height="64" rx="16" fill="#080e22" stroke="#00f0ff" stroke-width="1.5" filter="url(#cardGlow)"/>
    <text x="140" y="28" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ROOT SPECIFICATION</text>
    <text x="140" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">CycloneDX 1.6 CBOM</text>
  </g>

  <!-- Connectors from Root to 3 Sub-Nodes -->
  <path d="M 400 104 L 400 140 L 160 140 L 160 170" fill="none" stroke="rgba(0,240,255,0.4)" stroke-width="2"/>
  <path d="M 400 104 L 400 170" fill="none" stroke="rgba(0,240,255,0.6)" stroke-width="2"/>
  <path d="M 400 104 L 400 140 L 640 140 L 640 170" fill="none" stroke="rgba(0,240,255,0.4)" stroke-width="2"/>

  <!-- Node 1: Cryptographic Assets -->
  <g transform="translate(50, 170)">
    <rect width="220" height="110" rx="14" fill="#060c1d" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <circle cx="24" cy="28" r="8" fill="rgba(0,240,255,0.2)"/>
    <text x="40" y="32" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">cryptoAssets[]</text>
    <text x="20" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">&bull; algorithm: "RSA-2048"</text>
    <text x="20" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">&bull; keyLength: 2048</text>
    <text x="20" y="96" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">&bull; quantumVulnerable: true</text>
  </g>

  <!-- Node 2: Cryptographic Protocols -->
  <g transform="translate(290, 170)">
    <rect width="220" height="110" rx="14" fill="#060c1d" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <circle cx="24" cy="28" r="8" fill="rgba(59,130,246,0.2)"/>
    <text x="40" y="32" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">protocols[]</text>
    <text x="20" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">&bull; protocol: "TLS 1.3"</text>
    <text x="20" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">&bull; cipherSuite: "X25519..."</text>
    <text x="20" y="96" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">&bull; hybridMigration: true</text>
  </g>

  <!-- Node 3: Certificates & Keystores -->
  <g transform="translate(530, 170)">
    <rect width="220" height="110" rx="14" fill="#060c1d" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <circle cx="24" cy="28" r="8" fill="rgba(16,185,129,0.2)"/>
    <text x="40" y="32" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">certificates[]</text>
    <text x="20" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">&bull; issuer: "DigiCert Root"</text>
    <text x="20" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">&bull; signature: "ECDSA-P384"</text>
    <text x="20" y="96" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">&bull; nistTarget: "ML-DSA-87"</text>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(100, 340)">
    <rect width="600" height="85" rx="18" fill="url(#cardGrad)" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="300" y="35" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">AUTOMATED CODEBASE LINEAGE EXTRACTION</text>
    <text x="300" y="58" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" text-anchor="middle">Maps AST Call Sites &bull; Lockfile Dependencies &bull; API Gateways to Machine-Readable CBOM</text>
  </g>
</svg>
