<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="latticeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Glow -->
  <rect width="800" height="500" fill="#030712"/>
  <circle cx="400" cy="250" r="280" fill="url(#latticeGlow)"/>

  <!-- Lattice Grid Mesh -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="2 3">
    <!-- Isometric Grid Planes -->
    <line x1="120" y1="120" x2="680" y2="120"/>
    <line x1="100" y1="200" x2="700" y2="200"/>
    <line x1="80" y1="280" x2="720" y2="280"/>
    <line x1="100" y1="360" x2="700" y2="360"/>

    <line x1="160" y1="80" x2="280" y2="420"/>
    <line x1="280" y1="80" x2="400" y2="420"/>
    <line x1="400" y1="80" x2="520" y2="420"/>
    <line x1="520" y1="80" x2="640" y2="420"/>
  </g>

  <!-- Cryptographic Lattice Vectors (Module-LWE Basis) -->
  <g stroke="url(#vectorGrad)" stroke-width="2.5" filter="url(#neonBlur)">
    <!-- Basis Vector b1 -->
    <line x1="400" y1="250" x2="520" y2="170" marker-end="url(#arrow)"/>
    <!-- Basis Vector b2 -->
    <line x1="400" y1="250" x2="310" y2="340"/>
    <!-- Closest Vector Problem Point (Target) -->
    <line x1="400" y1="250" x2="470" y2="320" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- Lattice Nodes with Dual Cores -->
  <!-- Center Origin -->
  <circle cx="400" cy="250" r="7" fill="#00f0ff" filter="url(#neonBlur)"/>
  <circle cx="400" cy="250" r="3" fill="#ffffff"/>

  <!-- Surrounding Lattice Points -->
  <g fill="#00f0ff" opacity="0.85">
    <circle cx="520" cy="170" r="5"/>
    <circle cx="310" cy="340" r="5"/>
    <circle cx="280" cy="170" r="4" fill="#3b82f6"/>
    <circle cx="640" cy="250" r="4" fill="#6366f1"/>
    <circle cx="160" cy="250" r="4" fill="#6366f1"/>
    <circle cx="470" cy="320" r="6" fill="#10b981" filter="url(#neonBlur)"/>
    <circle cx="470" cy="320" r="2.5" fill="#ffffff"/>
    <circle cx="350" cy="120" r="3.5" fill="#3b82f6"/>
    <circle cx="580" cy="360" r="3.5" fill="#3b82f6"/>
    <circle cx="220" cy="360" r="3.5" fill="#6366f1"/>
  </g>

  <!-- Technical Annotation Labels -->
  <text x="535" y="165" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">b₁ (Lattice Basis)</text>
  <text x="215" y="355" fill="#6366f1" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">b₂ (Basis Vector)</text>
  <text x="485" y="335" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">t = As + e (ML-KEM Target)</text>
  <text x="400" y="460" fill="rgba(255,255,255,0.4)" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">NIST FIPS 203 Module Learning With Errors (M-LWE) Hardness Topology</text>
</svg>
